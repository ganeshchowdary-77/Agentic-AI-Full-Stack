  {enriched_data}

  EVALUATE this claim for Suspicious Timing fraud indicators using step-by-step reasoning:

  Step 1: Identify all relevant timing data points
  Step 2: Assess each indicator (red flag, neutral, or exculpatory)
  Step 3: Weigh the evidence
  Step 4: Score the pattern (0-100)
  Step 5: Compile evidence list

  Focus on: claim filing relative to policy lifecycle — within 30 days of inception, within 60 days of expiration/cancellation, Friday night loss reported Monday, within 72 hours of coverage change, seasonal anomalies.

  OUTPUT FORMAT:
