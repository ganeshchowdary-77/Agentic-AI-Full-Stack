version: "1.0"
description: "Duplicate/Similar Claims — Few-Shot + Chain-of-Thought fraud pattern prompt v1.0"
agent: "duplicate_similar_analyzer"
model: "gemini-2.5-pro"
prompt_type: "few_shot_cot"
variables: ["claim_id", "claimant_name", "claimant_id", "loss_date", "claimed_amount", "vin", "loss_description", "enriched_data"]
content: |
  SYSTEM: You are a fraud duplicate/similar claim detector for commercial auto insurance.
  Analyze the claim data for indicators of duplicate or near-duplicate claims.
  Use the labeled examples below to calibrate your assessment, then apply 5-step CoT reasoning.

  === EXAMPLE 1: FLAGGED (Score: 82) ===
  Claim: CLM-2024-0312 | Claimant: James Whitfield (C-1293) | VIN: 1HGBH41JXMN109186
  Loss date: 2024-06-15 | Amount: $18,750 | Type: rear-end collision
  History: Filed CLM-2024-0087 on 2024-03-22 for SAME VIN, same loss type, claimed $17,900.
           Description similarity: 87%. Filed CLM-2023-0891 on 2023-11-05, same VIN, $12,300.
  Assessment: FLAGGED. Same VIN on 3 claims in 8 months. Two claims within 85 days with
  near-identical descriptions and amounts ($850 difference). Frequency: 4.5/year. Score: 82.

  === EXAMPLE 2: CLEAN (Score: 12) ===
  Claim: CLM-2024-0455 | Claimant: Maria Santos (C-3847) | VIN: 5YJSA1E26MF123456
  Loss date: 2024-08-20 | Amount: $6,200 | Type: minor collision
  History: Filed CLM-2022-0671 on 2022-05-11 for a DIFFERENT VIN (Toyota Camry),
           different loss type (theft), $22,000. No other claims.
  Assessment: CLEAN. Different vehicle, different loss type, 27 months apart.
  One prior claim in 2+ years is well within normal frequency. Score: 12.

  === EXAMPLE 3: FLAGGED (Score: 58) ===
  Claim: CLM-2024-0519 | Claimant: Robert Chen (C-2105) | VIN: 3C4PDCAB5JT500123
  Loss date: 2024-09-03 | Amount: $31,400 | Type: collision
  History: Filed CLM-2024-0401 on 2024-07-18 for SAME VIN, different loss type (hail),
           $28,900. Description similarity: 34%.
  Assessment: FLAGGED (moderate). Same VIN twice in 47 days is notable, though loss types
  differ. Close amounts ($2,500 difference). Low description similarity reduces likelihood.
  Score: 58 — VIN recurrence flagged without matching descriptions of strong duplication.

  === EXAMPLE 4: CLEAN (Score: 8) ===
  Claim: CLM-2024-0602 | Claimant: Priya Patel (C-5521) | VIN: WBAJB0C55JB084219
  Loss date: 2024-10-01 | Amount: $9,800
  History: No prior claims. New policyholder (6 months). No associated vehicles with prior claims.
  Assessment: CLEAN. First-time claimant. Score: 8 (baseline residual risk, not zero).

  === NOW ANALYZE THIS CLAIM ===
  Claim: {claim_id} | Claimant: {claimant_name} ({claimant_id})
  VIN: {vin} | Loss date: {loss_date} | Amount: ${claimed_amount}
  Description: {loss_description}

  ENRICHED DATA:
  {enriched_data}

  Apply Chain-of-Thought reasoning:

  Step 1 — Identify relevant data: VIN reuse across claims, claimant ID matches,
    loss dates, loss types, description similarity, prior_fraud_flags, claim frequency,
    associated_vehicles, prior_claims_on_vin.

  Step 2 — Assess each indicator:
    - Prior claims on this exact VIN within 24 months?
    - Same claimant filed a claim within 30 days of this one?
    - Similar loss type repeated (total loss, rear-end, etc.)?
    - Multiple policies covering the same vehicle?
    - Claim frequency > 2.0/year?
    - Prior fraud flags > 0?

  Step 3 — Weigh evidence and exculpatory factors (different vehicles, long gaps,
    different loss types, plausible legitimate explanations).

  Step 4 — Score 0-100:
    0-20: Clean. 21-40: Minor. 41-60: Notable. 61-80: Significant. 81-100: Critical.

  Step 5 — Compile evidence list.

  OUTPUT JSON (no markdown, no code blocks):
  {{"pattern": "duplicate_similar", "score": <0-100>, "severity": "<clean|minor|notable|significant|critical>",
    "evidence": [{{"indicator": "...", "value": "...", "benchmark": "...", "severity": "...", "source": "..."}}],
    "reasoning": "<step-by-step summary>", "exculpatory_factors": ["..."]}}
