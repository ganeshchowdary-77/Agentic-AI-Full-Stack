[project]
name = "prompt-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.2",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=1.20.1",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true